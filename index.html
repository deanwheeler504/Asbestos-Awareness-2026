<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asbestos Awareness 2026 — Fallon Solutions Safety Toolbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
  /* Fallon 2026 brand: red #EE2E24, blue #1E94D2, navy #09557C (sampled from the 2026 logo files) */
  :root{
    --red:#EE2E24; --red-dark:#C4211A; --red-soft:#FDEAE9;
    --blue:#1E94D2; --blue-dark:#09557C; --blue-soft:#E6F3FB;
    --ink:#16181D; --slate:#62666E; --paper:#FFFFFF; --mist:#F3F5F7;
    --line:#E2E5EA; --ok:#15803D; --okbg:#DCFCE7; --bad:#DC2626; --badbg:#FEE2E2;
    --amber:#B45309; --amberbg:#FEF3C7;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --shadow-lg:0 12px 40px rgba(0,0,0,.12);
    --skew:-24deg;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:'Barlow',system-ui,sans-serif;color:var(--ink);background:var(--mist);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:inherit;color:inherit}
  .app{max-width:880px;margin:0 auto;min-height:100vh;background:var(--paper);
    display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}

  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px)}
  .topbar img{height:34px;display:block}
  .crumb{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:500;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .progress{height:5px;background:var(--line);position:relative;overflow:hidden}
  .progress > span{position:absolute;left:0;top:0;height:100%;width:0;
    background:linear-gradient(90deg,var(--red),var(--red) 70%,var(--blue));transition:width .5s cubic-bezier(.4,0,.2,1)}

  .stage{flex:1;position:relative}
  .screen{display:none;padding:34px 30px 30px}
  .screen.active{display:block}
  .reveal{opacity:0}
  .screen.active .reveal{opacity:1;animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .reveal[data-d="1"]{animation-delay:.07s!important}
  .reveal[data-d="2"]{animation-delay:.14s!important}
  .reveal[data-d="3"]{animation-delay:.21s!important}
  .reveal[data-d="4"]{animation-delay:.28s!important}
  .reveal[data-d="5"]{animation-delay:.35s!important}
  .reveal[data-d="6"]{animation-delay:.42s!important}
  @media (prefers-reduced-motion:reduce){.screen.active .reveal{animation:none}}

  /* kicker: skewed red + blue ribbons, echoing the 2026 logo */
  .kicker{display:inline-flex;align-items:center;gap:10px;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-dark);margin-bottom:14px}
  .tag{display:inline-block;background:var(--red);color:#fff;padding:5px 12px 4px;font-size:12px;line-height:1;
    transform:skewX(var(--skew));border-radius:2px 5px 2px 5px}
  .tag > span{display:inline-block;transform:skewX(calc(-1*var(--skew)))}
  .tag.blue{background:var(--blue)}
  .new{display:inline-block;background:var(--blue);color:#fff;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:11px;
    letter-spacing:.1em;padding:3px 9px 2px;border-radius:999px;vertical-align:3px;margin-left:6px;text-transform:uppercase}

  h1.title{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:clamp(28px,5.4vw,46px);line-height:1.02;
    text-transform:uppercase;margin-bottom:14px}
  h2.head{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:clamp(23px,4.4vw,34px);line-height:1.06;
    text-transform:uppercase;margin-bottom:14px}
  .lede{font-size:clamp(16px,2.2vw,18px);color:#30333a;max-width:62ch;margin-bottom:8px}
  p+p{margin-top:12px}
  strong,b{font-weight:700}

  .shockline{margin:8px 0 20px;padding:24px 24px 22px;border-radius:14px;
    background:linear-gradient(135deg,var(--ink),#272b33);color:#fff;position:relative;overflow:hidden}
  .shockline:before{content:"";position:absolute;inset:0;opacity:.12;
    background:repeating-linear-gradient(45deg,#000 0 14px,var(--red) 14px 28px)}
  .shockline .q{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:clamp(21px,4vw,30px);line-height:1.08;
    text-transform:uppercase;position:relative}
  .shockline .sub{position:relative;margin-top:8px;color:#d9dce1;font-size:15.5px}

  .grid{display:grid;gap:14px;margin-top:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
  .card{border:1px solid var(--line);border-radius:14px;padding:18px 18px;background:var(--paper);box-shadow:var(--shadow)}
  .card h3{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.01em;
    margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .card ul{list-style:none;margin-top:2px}
  .card li{position:relative;padding-left:20px;font-size:15px;margin-top:8px;color:#383b42}
  .card li:before{content:"";position:absolute;left:2px;top:8px;width:8px;height:8px;background:var(--red);
    transform:skewX(var(--skew))}
  .card.blue li:before{background:var(--blue)}
  .card.newcard{border-color:#BFE0F3;background:linear-gradient(180deg,var(--blue-soft),#fff 60%)}

  .chip{width:38px;height:38px;min-width:38px;border-radius:10px;display:grid;place-items:center;
    background:var(--red-soft);color:var(--red)}
  .chip.b{background:var(--blue-soft);color:var(--blue-dark)}
  .chip svg{width:21px;height:21px}
  .ii{display:inline-flex;width:18px;height:18px;vertical-align:-3px;margin-right:8px;flex:none}
  .ii svg{width:18px;height:18px}

  .note{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;background:var(--amberbg);
    color:#5a3d05;border:1px solid #FBD38D}
  .note.red{background:var(--red-soft);color:var(--red-dark);border-color:#F6C2BE}
  .note.blue{background:var(--blue-soft);color:var(--blue-dark);border-color:#BFE0F3}

  .checklist{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .check{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);
    border-radius:12px;background:var(--mist)}
  .check .box{width:24px;height:24px;min-width:24px;border-radius:7px;background:var(--ok);display:grid;place-items:center;margin-top:1px}
  .check .box svg{width:15px;height:15px;stroke:#fff;stroke-width:3.4;fill:none}
  .check .t{font-size:15.5px;color:#2a2c31}
  .check.danger .box{background:var(--red)}
  .check.info .box{background:var(--blue)}

  /* ---------- interactive: activity frame ---------- */
  .activity{margin-top:18px;border:2px dashed #BFE0F3;border-radius:16px;padding:18px;background:#FBFDFF}
  .act-h{display:flex;align-items:center;gap:10px;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:13px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--blue-dark);margin-bottom:10px}
  .act-h .pill{background:var(--blue);color:#fff;border-radius:999px;padding:3px 10px 2px;font-size:11px}
  .act-status{margin-top:12px;font-size:14.5px;min-height:22px}
  .act-status.ok{color:var(--ok);font-weight:600}
  .act-status.no{color:var(--bad);font-weight:600}
  @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  .shake{animation:shake .45s}

  /* order activity */
  .slots{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .slot{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;border:1.5px dashed var(--line);
    min-height:50px;font-size:15px;color:var(--slate);background:#fff}
  .slot .n{width:28px;height:28px;min-width:28px;border-radius:8px;background:var(--mist);display:grid;place-items:center;
    font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;color:var(--slate)}
  .slot.filled{border-style:solid;border-color:var(--ok);background:var(--okbg);color:#14532d}
  .slot.filled .n{background:var(--ok);color:#fff}
  .slot .lbl b{display:block;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;text-transform:uppercase;font-size:14px;letter-spacing:.03em}
  .pool{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;
    font-weight:600;font-size:15px;transition:.15s}
  .pchip:hover{border-color:var(--blue)}
  .pchip.used{display:none}

  /* hotspot activity */
  .hs-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#EAF5FC,#fff 70%)}
  .hs-wrap svg.scene{display:block;width:100%;height:auto}
  .hs{cursor:pointer}
  .hs .ring{fill:none;stroke:var(--red);stroke-width:3;opacity:.9;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
  .hs.found .ring{stroke:var(--ok);animation:none}
  .hs .dot{fill:var(--red)}
  .hs.found .dot{fill:var(--ok)}
  .hs.decoy.found .dot{fill:var(--slate)}
  .hs.decoy.found .ring{stroke:var(--slate)}
  .hs:focus{outline:none}
  .hs:focus .ring{stroke-width:5}
  @keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
  .hs-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .hs-legend span{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--mist);color:var(--slate)}
  .hs-legend span.on{background:var(--okbg);color:#14532d}
  .hs-info{margin-top:12px;border-radius:12px;padding:13px 15px;background:#fff;border:1px solid var(--line);font-size:14.5px;min-height:48px}
  .hs-info b{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em}

  /* verdict cards */
  .vcard{border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff;box-shadow:var(--shadow);text-align:center}
  .vcard .vc-n{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-size:12px;letter-spacing:.14em;color:var(--slate);text-transform:uppercase;margin-bottom:8px}
  .vcard .vc-t{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:clamp(19px,3.4vw,23px);line-height:1.2;margin-bottom:16px}
  .vbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .vbtn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 18px;
    font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;min-width:150px;justify-content:center}
  .vbtn.y{border-color:#86EFAC;color:var(--ok)}
  .vbtn.n{border-color:#FCA5A5;color:var(--bad)}
  .vbtn:hover{transform:translateY(-1px)}
  .vbtn svg{width:18px;height:18px}
  .vfb{margin-top:14px;text-align:left;border-radius:10px;padding:13px 15px;font-size:14.5px;display:none}
  .vfb.show{display:block;animation:rise .3s ease}
  .vfb.ok{background:var(--okbg);color:#14532d;border:1px solid #86EFAC}
  .vfb.no{background:var(--badbg);color:#7f1d1d;border:1px solid #FCA5A5}
  .vtally{display:flex;gap:6px;justify-content:center;margin-top:14px}
  .vtally i{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .vtally i.ok{background:var(--ok)} .vtally i.no{background:var(--bad)} .vtally i.cur{background:var(--blue)}

  /* meter simulator */
  .meter-row{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:start}
  @media(max-width:640px){.meter-row{grid-template-columns:1fr}}
  .meter{background:#2b2f36;border-radius:22px;padding:14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);max-width:200px;margin:0 auto;border:5px solid #F2C230}
  .lcd{background:#C9D8B6;border-radius:8px;padding:12px 10px;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;color:#1f2a14;text-align:right;
    font-size:40px;line-height:1;letter-spacing:.02em;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
  .lcd small{font-size:16px;margin-left:4px}
  .lcd-sub{font-size:11px;letter-spacing:.12em;text-align:left;color:#43512f;margin-top:6px}
  .meter-dial{margin:14px auto 4px;width:84px;height:84px;border-radius:50%;background:#1d2026;border:4px solid #444a54;position:relative}
  .meter-dial:after{content:"";position:absolute;left:50%;top:8px;width:6px;height:30px;background:#F2C230;border-radius:3px;transform:translateX(-50%)}
  .meter-cat{color:#fff;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-size:11px;text-align:center;letter-spacing:.1em;opacity:.8}
  .steps-pick{display:flex;flex-direction:column;gap:8px}
  .spick{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 14px;cursor:pointer;font-size:15px;display:flex;gap:10px;align-items:flex-start}
  .spick:hover{border-color:var(--blue)}
  .spick .k{width:26px;height:26px;min-width:26px;border-radius:7px;background:var(--mist);display:grid;place-items:center;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;color:var(--slate)}
  .spick.done{border-color:var(--ok);background:var(--okbg);cursor:default}
  .spick.done .k{background:var(--ok);color:#fff}

  /* multi-select */
  .msel{display:flex;flex-direction:column;gap:8px}
  .mopt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 14px;cursor:pointer;font-size:15px}
  .mopt .bx{width:22px;height:22px;min-width:22px;border-radius:6px;border:2px solid #c2c7cf;display:grid;place-items:center;margin-top:1px}
  .mopt.on{border-color:var(--blue);background:var(--blue-soft)}
  .mopt.on .bx{background:var(--blue);border-color:var(--blue)}
  .mopt .bx svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0}
  .mopt.on .bx svg{opacity:1}
  .mopt.right{border-color:var(--ok);background:var(--okbg)}
  .mopt.wrong{border-color:var(--bad);background:var(--badbg)}
  .mopt .why{display:none;font-size:13.5px;margin-top:4px;color:#3a3d44}
  .mopt.right .why,.mopt.wrong .why,.mopt.miss .why{display:block}
  .mopt.miss{border-color:var(--amber);background:var(--amberbg)}

  /* flip cards */
  .flips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  @media(max-width:640px){.flips{grid-template-columns:1fr}.flip,.flip-in{min-height:120px}}
  .flip{perspective:900px;min-height:170px;cursor:pointer;border:none;background:none;padding:0;text-align:left}
  .flip-in{position:relative;width:100%;height:100%;min-height:170px;transition:transform .55s;transform-style:preserve-3d}
  .flip.on .flip-in{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:14px;padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;justify-content:center}
  .front{background:var(--ink);color:#fff}
  .front .fq{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:19px;line-height:1.15;text-transform:uppercase}
  .front .ft{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9aa1ab;margin-top:12px;font-family:'Oswald'}
  .back{background:var(--blue-soft);color:var(--blue-dark);border:1px solid #BFE0F3;transform:rotateY(180deg);font-size:14.5px}
  .back b{color:var(--ink)}

  /* scenario */
  .scn{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .scn-top{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:16px 18px}
  .scn-top .st{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .scn-top .sh{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;margin-top:2px}
  .scn-body{padding:16px 18px}
  .scn-body p{font-size:15.5px}
  .scn-opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}

  /* table */
  .tablewrap{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{border-collapse:collapse;width:100%;font-size:14.5px}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:var(--ink);color:#fff;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:500;text-transform:uppercase;font-size:12.5px;letter-spacing:.05em}
  td:first-child{font-weight:700;width:38%}
  tr:last-child td{border-bottom:none}

  /* footer nav */
  .nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 24px;border-top:1px solid var(--line);
    position:sticky;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px)}
  .btn{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;border:none;cursor:pointer;
    border-radius:10px;padding:13px 24px;transition:transform .12s ease, box-shadow .2s ease, background .2s ease;display:inline-block;
    text-decoration:none;text-align:center}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(238,46,36,.30)}
  .btn-primary:hover{background:var(--red-dark)}
  .btn-blue{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(30,148,210,.28)}
  .btn-blue:hover{background:var(--blue-dark)}
  .btn-ghost{background:transparent;color:var(--slate);padding-left:6px;padding-right:6px}
  .btn-ghost:hover{color:var(--ink)}
  .btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
  .navmid{font-size:12.5px;color:var(--slate);text-align:center;flex:1}
  .navmid .lock{display:inline-flex;align-items:center;gap:6px;color:var(--blue-dark);font-weight:600}

  /* welcome */
  .welcome{text-align:center;padding:40px 28px 34px}
  .welcome .logo{height:64px;margin:0 auto 22px;display:block}
  .welcome .eyebrow{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:500;letter-spacing:.22em;font-size:13px;text-transform:uppercase;color:var(--blue-dark);margin-bottom:10px}
  .welcome h1{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:clamp(30px,6vw,52px);line-height:1;text-transform:uppercase;margin-bottom:12px}
  .welcome .yr{color:var(--red)}
  .welcome .desc{max-width:50ch;margin:0 auto 22px;color:#40434a;font-size:16.5px}
  .meta-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
  .meta-row .m{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--slate);font-weight:600}
  .meta-row .m svg{width:17px;height:17px;color:var(--red)}
  .form{max-width:440px;margin:0 auto;text-align:left}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-bottom:6px}
  .field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:'Barlow';font-size:16px;color:var(--ink);background:#fff;transition:border .2s}
  .field input:focus,.field select:focus{outline:none;border-color:var(--blue)}
  .field .err{border-color:var(--bad)}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:420px){.roles{grid-template-columns:1fr}}
  .role{border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;cursor:pointer;text-align:left;font-size:14px}
  .role b{display:block;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:14.5px;text-transform:uppercase;letter-spacing:.02em}
  .role span{color:var(--slate);font-size:12.5px}
  .role.on{border-color:var(--red);background:var(--red-soft)}
  .role.on.nonel{border-color:var(--blue);background:var(--blue-soft)}
  .ferr{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:4px}
  .start-btn{width:100%;margin-top:6px;padding:15px}
  .trackbadge{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--slate)}

  /* quiz */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .qcount{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
  .qbar{flex:1;height:6px;background:var(--line);border-radius:3px;margin-left:16px;overflow:hidden}
  .qbar > span{display:block;height:100%;background:var(--red);transition:width .4s}
  .qtext{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:clamp(19px,3.4vw,25px);line-height:1.2;margin-bottom:18px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;
    transition:border .15s,background .15s;font-size:15.5px;text-align:left;width:100%}
  .opt:hover{border-color:#b9bec6}
  .opt .key{width:26px;height:26px;min-width:26px;border-radius:7px;background:var(--mist);display:grid;place-items:center;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--slate)}
  .opt.sel{border-color:var(--blue);background:var(--blue-soft)}
  .opt.sel .key{background:var(--blue);color:#fff}
  .opt.correct{border-color:var(--ok);background:var(--okbg)}
  .opt.correct .key{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--badbg)}
  .opt.wrong .key{background:var(--bad);color:#fff}
  .opt.locked{cursor:default;pointer-events:none}
  .feedback{margin-top:14px;padding:13px 15px;border-radius:10px;font-size:14.5px;display:none}
  .feedback.show{display:block;animation:rise .3s ease}
  .feedback.ok{background:var(--okbg);color:#14532d;border:1px solid #86EFAC}
  .feedback.no{background:var(--badbg);color:#7f1d1d;border:1px solid #FCA5A5}

  /* result + cert */
  .result{text-align:center;padding:38px 28px 28px}
  .scorering{width:150px;height:150px;margin:0 auto 20px;position:relative}
  .scorering svg{transform:rotate(-90deg)}
  .scorering .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:38px}
  .result h2{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:32px;text-transform:uppercase;margin-bottom:8px}
  .result .pass{color:var(--ok)} .result .fail{color:var(--red)}
  .result .rsub{color:#40434a;max-width:48ch;margin:0 auto 22px;font-size:16px}
  .review{text-align:left;margin:22px 0;display:flex;flex-direction:column;gap:10px}
  .rev{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
  .rev .rq{font-weight:600;margin-bottom:4px}
  .rev .ra{color:var(--ok)} .rev .ra.bad{color:var(--bad)}
  .cert{border:2px solid var(--ink);border-radius:16px;padding:28px 26px 56px;margin:6px 0 4px;background:#fff;position:relative;overflow:hidden;text-align:left}
  .cert:before{content:"";position:absolute;bottom:0;right:-50px;width:240px;height:22px;background:var(--red);transform:skewX(var(--skew))}
  .cert:after{content:"";position:absolute;bottom:26px;right:-40px;width:170px;height:12px;background:var(--blue);transform:skewX(var(--skew))}
  .cert .clogo{height:48px;margin-bottom:16px;position:relative}
  .cert .ctitle{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
  .cert .cmod{color:var(--red);font-weight:700;font-size:15px;margin-bottom:20px}
  .cert .crow{display:flex;flex-wrap:wrap;gap:18px 36px}
  .cert .ci .k{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-bottom:2px}
  .cert .ci .v{font-size:17px;font-weight:600}
  .cert .stamp{display:inline-block;margin-top:20px;border:3px solid var(--ok);color:var(--ok);font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:15px;
    letter-spacing:.08em;text-transform:uppercase;padding:6px 13px;border-radius:8px;transform:rotate(-7deg);opacity:.9;background:#fff}
  .decl{display:flex;gap:12px;align-items:flex-start;text-align:left;max-width:520px;margin:20px auto 0;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:14.5px;background:#fff}
  .decl.on{border-color:var(--ok);background:var(--okbg)}
  .decl .bx{width:22px;height:22px;min-width:22px;border-radius:6px;border:2px solid #c2c7cf;display:grid;place-items:center;margin-top:1px}
  .decl.on .bx{background:var(--ok);border-color:var(--ok)}
  .decl .bx svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0}
  .decl.on .bx svg{opacity:1}
  .sendbox{max-width:520px;margin:18px auto 0;padding:22px 22px 20px;border-radius:18px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;text-align:center;box-shadow:0 14px 34px rgba(238,46,36,.34)}
  .sendbox .se{display:inline-block;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:5px 13px;border-radius:999px;margin-bottom:10px}
  .sendbox .stt{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:21px;text-transform:uppercase;line-height:1.2}
  .sendbox .ssub{font-size:14px;color:rgba(255,255,255,.9);margin:6px auto 14px;max-width:40ch}
  .sendbox .btn{background:#fff;color:var(--red-dark);box-shadow:none;width:100%}
  .sendbox .btn[aria-disabled="true"]{opacity:.6}
  .sentok{display:none;margin:14px auto 0;max-width:520px;font-size:14px;color:var(--slate)}
  .minor-links{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .minor-links button{background:none;border:none;padding:0;font-size:13px;color:var(--slate);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .minor-links span{color:var(--line);font-size:13px}
  .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
  .toast.on{opacity:1}

  @media print{
    .topbar,.progress,.nav,.btn-row,.minor-links,.sendbox,.decl,.sentok{display:none!important}
    .app{box-shadow:none} body{background:#fff}
  }
  @media(max-width:600px){
    .screen{padding:26px 16px 22px}
    .nav{padding:12px 16px}
    .btn{padding:12px 16px;font-size:14px}
    .topbar{padding:10px 16px}
    .topbar img{height:30px}
    .activity{padding:14px}
    .navmid{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <img id="brandLogo" alt="Fallon Solutions">
    <div class="crumb" id="crumb">Safety Toolbox</div>
  </div>
  <div class="progress"><span id="pbar"></span></div>
  <div class="stage" id="stage"></div>
  <div class="nav" id="nav" style="display:none">
    <button class="btn btn-ghost" id="backBtn">&larr; Back</button>
    <div class="navmid" id="navmid"></div>
    <button class="btn btn-primary" id="nextBtn">Next &rarr;</button>
  </div>
</div>
<div class="toast" id="toast"></div>

/* 1. ORDER — tap items in the right order */
function orderActivity(id,title,items){ // items: [{t:'Consult',d:'desc'}] in correct order
  var pool=shuffle(items.map(function(x,i){return {t:x.t,d:x.d,i:i};}));
  var html='<div class="activity reveal" data-d="3" id="'+id+'">'+
    '<div class="act-h"><span class="pill">Activity</span>'+title+'</div>'+
    '<div class="slots">'+items.map(function(x,i){return '<div class="slot" data-s="'+i+'"><span class="n">'+(i+1)+'</span><span class="lbl">Tap the next step below</span></div>';}).join('')+'</div>'+
    '<div class="pool">'+pool.map(function(p){return '<button class="pchip" data-i="'+p.i+'">'+p.t+'</button>';}).join('')+'</div>'+
    '<div class="act-status" id="'+id+'-st"></div></div>';
  function wire(){
    var root=document.getElementById(id); if(!root) return;
    var next=0, misses=0;
    if(state.activity[id]){ // already done — show completed
      next=items.length; root.querySelectorAll('.slot').forEach(function(s,i){s.classList.add('filled');s.querySelector('.lbl').innerHTML='<b>'+items[i].t+'</b>'+items[i].d;});
      root.querySelectorAll('.pchip').forEach(function(c){c.classList.add('used');});
      document.getElementById(id+'-st').className='act-status ok';document.getElementById(id+'-st').textContent='Done — sequence locked in.';return;}
    root.querySelectorAll('.pchip').forEach(function(c){
      c.onclick=function(){
        var i=parseInt(c.getAttribute('data-i'),10); var st=document.getElementById(id+'-st');
        if(i===next){
          var s=root.querySelector('.slot[data-s="'+i+'"]'); s.classList.add('filled');
          s.querySelector('.lbl').innerHTML='<b>'+items[i].t+'</b>'+items[i].d; c.classList.add('used'); next++;
          st.className='act-status'; st.textContent='';
          if(next===items.length){st.className='act-status ok';st.textContent=misses===0?'Perfect — first time, every step.':'Sequence complete.';state.activity[id]=true;unlockNext();}
        } else { misses++; c.classList.add('shake'); setTimeout(function(){c.classList.remove('shake');},460);
          st.className='act-status no'; st.textContent='Not yet — what has to happen before "'+items[i].t+'"?'; }
      };
    });
  }
  return {html:html,wire:wire,gate:id};
}

/* 2. VERDICT CARDS — secure / not secure */
function verdictActivity(id,title,yesLbl,noLbl,cards){ // cards: [{t, ok:true/false, why}]
  var html='<div class="activity reveal" data-d="3" id="'+id+'"><div class="act-h"><span class="pill">Activity</span>'+title+'</div><div id="'+id+'-c"></div></div>';
  function wire(){
    var host=document.getElementById(id+'-c'); if(!host) return;
    var k=0, res=[];
    function draw(){
      if(k>=cards.length){
        var good=res.filter(Boolean).length;
        host.innerHTML='<div class="vcard"><div class="vc-n">All '+cards.length+' done</div><div class="vc-t">You called '+good+' of '+cards.length+' correctly</div>'+
          '<div class="vtally">'+res.map(function(r){return '<i class="'+(r?'ok':'no')+'"></i>';}).join('')+'</div>'+
          '<div style="margin-top:14px"><button class="btn btn-ghost" id="'+id+'-again">Run it again</button></div></div>';
        document.getElementById(id+'-again').onclick=function(){k=0;res=[];draw();};
        state.activity[id]=true; unlockNext(); return;
      }
      var c=cards[k];
      host.innerHTML='<div class="vcard"><div class="vc-n">Situation '+(k+1)+' of '+cards.length+'</div><div class="vc-t">'+c.t+'</div>'+
        '<div class="vbtns"><button class="vbtn y" data-v="1">'+I.check+yesLbl+'</button><button class="vbtn n" data-v="0">'+I.cross+noLbl+'</button></div>'+
        '<div class="vfb" id="'+id+'-fb"></div>'+
        '<div class="vtally">'+cards.map(function(_,j){return '<i class="'+(j<k?(res[j]?'ok':'no'):(j===k?'cur':''))+'"></i>';}).join('')+'</div></div>';
      host.querySelectorAll('.vbtn').forEach(function(b){
        b.onclick=function(){
          var v=b.getAttribute('data-v')==='1'; var right=(v===c.ok); res[k]=right;
          host.querySelectorAll('.vbtn').forEach(function(x){x.disabled=true;x.style.opacity=(x===b?1:.35);});
          var fb=document.getElementById(id+'-fb'); fb.className='vfb show '+(right?'ok':'no');
          fb.innerHTML='<b>'+(right?'Correct — ':'Not quite — ')+(c.ok?yesLbl:noLbl)+'.</b> '+c.why+
            '<div style="margin-top:10px;text-align:right"><button class="btn btn-blue" style="padding:9px 16px" id="'+id+'-n">'+(k===cards.length-1?'Finish':'Next situation')+' &rarr;</button></div>';
          document.getElementById(id+'-n').onclick=function(){k++;draw();};
        };
      });
    }
    if(state.activity[id]){k=cards.length;res=cards.map(function(){return true;});
      host.innerHTML='<div class="vcard"><div class="vc-n">Completed</div><div class="vc-t">Activity done</div><button class="btn btn-ghost" id="'+id+'-again">Run it again</button></div>';
      document.getElementById(id+'-again').onclick=function(){k=0;res=[];draw();}; return;}
    draw();
  }
  return {html:html,wire:wire,gate:id};
}

    // meter box
    '<rect x="244" y="228" width="48" height="54" rx="3" fill="#7a5a3a" stroke="#4d3824" stroke-width="2"/><rect x="250" y="236" width="36" height="38" fill="#2b2523"/><circle cx="262" cy="248" r="5" fill="#d7d2c4"/><circle cx="276" cy="262" r="4" fill="#d7d2c4"/>'+
    // door
    '<rect x="350" y="238" width="44" height="80" fill="#8a5a3a"/><circle cx="386" cy="280" r="2.5" fill="#e8d08a"/>'+
    // bathroom cutaway
    '<rect x="420" y="196" width="100" height="116" fill="#fff" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 3"/><text x="470" y="210" font-size="9" text-anchor="middle" fill="#62666E" font-family="Oswald, Arial Narrow, sans-serif">BATHROOM (CUTAWAY)</text>'+
    '<g stroke="#cfd6dd"><path d="M420 228h100M420 248h100M420 268h100M445 214v70M470 214v70M495 214v70"/></g>'+
    '<rect x="420" y="288" width="100" height="24" fill="#d9c9a6"/><path d="M445 288v24M470 288v24M495 288v24" stroke="#bfae88"/>'+
    // downpipe
    '<rect x="640" y="180" width="10" height="138" fill="#B9B6AE" stroke="#8f8b82"/>'+
    spots+'</svg>';

    '<div class="hs-wrap">'+svg+'</div>'+
    '<div class="hs-info" id="'+id+'-info">Tap a point to inspect it.</div>'+
    '<div class="act-status" id="'+id+'-st">0 of '+total+' found</div></div>';
  function wire(){
    var root=document.getElementById(id); if(!root) return;

  var Q=QUIZ();
  var lines=['Toolbox: '+TOPIC,'Version: '+version,'Name: '+state.user.name,'Email: '+state.user.email,'Role: '+roleLabel(state.user.role),
    'Date: '+dmy,'Time: '+tm,'Score: '+s.c+'/'+s.n+' ('+s.p+'%)','Result: PASSED','Declaration: I have completed this toolbox. I will treat pre-1990 materials as asbestos, only screw into or drill holes up to 25 mm with an asbestos kit following the SWMS, manage all dust, leave the site clean, double bag and duct tape all asbestos waste and bring it to the asbestos bin at the office, and STOP and call when a job needs more.','',
    'Answers:'];
  lines[lines.length-1]='Answers: '+Q.map(function(it,i){return (i+1)+(state.answers[i]===it.a?' ✓':' ✗');}).join('  ');
  lines.push('','Module: '+VERSION);
  var subject='Toolbox – '+TOPIC+' – '+state.user.name;
  var body=lines.join('\r\n');
  var href='mailto:'+SUBMIT_TO+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  crumb.textContent='Completed';
  var div=document.createElement('div'); div.className='screen';
  div.innerHTML='<div class="result" style="padding-top:26px">'+
    '<div class="cert reveal"><img class="clogo" src="'+LOGO+'" alt="Fallon Solutions"><div class="ctitle">Certificate of Completion</div><div class="cmod">'+TOPIC.replace('&','&amp;')+' · '+version+'</div>'+
      '<div class="crow">'+ci('Name',esc(state.user.name))+ci('Role',roleLabel(state.user.role))+ci('Score',s.p+'% ('+s.c+'/'+s.n+')')+ci('Completed',dmy+' · '+tm)+'</div><div class="stamp">Passed</div></div>'+
    '<button class="decl reveal" data-d="1" id="decl"><span class="bx">'+I.check+'</span><span>I completed this toolbox myself. I will <b>treat pre-1990 materials as asbestos</b>, only screw in or drill holes <b>up to 25 mm</b> with the kit and SWMS, <b>manage all dust and leave the site clean</b>, <b>double bag and duct tape</b> the waste and bring it to the <b>asbestos bin at the office</b> — and <b>STOP and call</b> when a job needs more.</span></button>'+
    '<div class="sendbox reveal" data-d="2"><span class="se">Last step</span><div class="stt">Send your completion to Safety</div><div class="ssub">Opens your email with everything filled in — just press <b>Send</b>.</div>'+
      '<a class="btn" id="sendBtn" href="'+href+'" aria-disabled="true">'+ii(I.mail)+'Open email &amp; send</a></div>'+
    '<div class="sentok" id="sentok">Email didn’t open? Tap <b>Copy details</b> and email them to <b>'+SUBMIT_TO+'</b> with the subject “'+esc(subject)+'”.</div>'+
    '<div class="minor-links reveal" data-d="3"><button id="copyBtn">Copy details</button><span>&middot;</span><button id="printBtn">Save / print certificate</button><span>&middot;</span><button id="restart">Start over</button></div>'+
    '<p style="font-size:11.5px;color:var(--slate);margin-top:18px">'+VERSION+'</p></div>';
  stage.innerHTML=''; stage.appendChild(div); void div.offsetWidth; div.classList.add('active'); window.scrollTo(0,0);
  var decl=document.getElementById('decl'), send=document.getElementById('sendBtn');
  decl.onclick=function(){decl.classList.toggle('on'); send.setAttribute('aria-disabled',decl.classList.contains('on')?'false':'true');};
  send.addEventListener('click',function(e){ if(!decl.classList.contains('on')){e.preventDefault();toast('Tick the declaration first');return;} setTimeout(function(){document.getElementById('sentok').style.display='block';},800); });
  document.getElementById('copyBtn').onclick=function(){
    var txt='To: '+SUBMIT_TO+'\nSubject: '+subject+'\n\n'+lines.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Copied — paste into an email');},function(){fallbackCopy(txt);});} else fallbackCopy(txt);
  };
  document.getElementById('printBtn').onclick=function(){window.print();};
  document.getElementById('restart').onclick=function(){state.i=0;state.activity={};state.answers=[];SCREENS=[WELCOME];renderScreen();};
}
function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied — paste into an email');}catch(e){toast('Copy failed — please note your details');}document.body.removeChild(a);}
function ci(k,v){return '<div class="ci"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';}

/* boot */
document.getElementById('brandLogo').src=LOGO;
renderScreen();
</script>
</body>
</html>
